name: maiavm sync watchdog

# Fork-only (see FORK.md). Measures actual commit lag against
# NousResearch/hermes-agent:main, checks latest sync run health and open PR age,
# and self-heals dropped fork crons by dispatching maiavm-upstream-sync.yml.

on:
  schedule:
    - cron: '49 7,19 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  check:
    if: github.repository == 'DevvGwardo/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MAIAVM_SYNC_ALERT_TELEGRAM_TOKEN: ${{ secrets.MAIAVM_SYNC_ALERT_TELEGRAM_TOKEN }}
      MAIAVM_SYNC_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.MAIAVM_SYNC_ALERT_TELEGRAM_CHAT_ID }}
      MAIAVM_SYNC_ALERT_WEBHOOK: ${{ secrets.MAIAVM_SYNC_ALERT_WEBHOOK }}
      MAX_BEHIND_COMMITS: '600'
      MAX_RUN_AGE_HOURS: '18'
      MAX_SUCCESS_AGE_HOURS: '48'
      MAX_OPEN_PR_HOURS: '48'
    steps:
      - name: Check upstream commit lag and sync health
        shell: bash
        run: |
          set -euo pipefail
          wf="maiavm-upstream-sync.yml"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs"

          # Measure real commit lag without downloading blobs
          git init -q watchdog-git
          cd watchdog-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git remote add upstream "https://github.com/NousResearch/hermes-agent.git"
          git fetch --no-tags --filter=blob:none origin maiavm
          git fetch --no-tags --filter=blob:none upstream main
          behind_commits="$(git rev-list --count origin/maiavm..upstream/main)"
          cd ..

          last_run_json="$(gh api "$api?per_page=1" --jq '.workflow_runs[0] // {}')"
          last_any="$(jq -r '.created_at // empty' <<<"$last_run_json")"
          last_conclusion="$(jq -r '.conclusion // .status // empty' <<<"$last_run_json")"
          last_success="$(gh api "$api?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')"
          open_pr_created="$(gh pr list --repo "$GITHUB_REPOSITORY" --base maiavm --head bot/upstream-sync --state open --json createdAt --jq '.[0].createdAt // empty')"

          now="$(date -u +%s)"
          age_hours() {
            [ -n "$1" ] || { echo 999999; return; }
            echo $(( (now - $(date -u -d "$1" +%s)) / 3600 ))
          }

          run_age_h="$(age_hours "$last_any")"
          success_age_h="$(age_hours "$last_success")"
          pr_age_h=0
          if [ -n "$open_pr_created" ]; then
            pr_age_h="$(age_hours "$open_pr_created")"
          fi

          problems=""
          if [ "$run_age_h" -gt "$MAX_RUN_AGE_HOURS" ]; then
            problems="${problems}Sync workflow has not run in ${run_age_h}h (last: ${last_any:-never}); dispatching now. "
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref maiavm || true
          fi
          if [ "$last_conclusion" = "failure" ] && [ "$success_age_h" -gt "$MAX_SUCCESS_AGE_HOURS" ]; then
            problems="${problems}Latest sync run failed (${last_any}) and no success in ${success_age_h}h. "
          fi
          if [ "$behind_commits" -gt "$MAX_BEHIND_COMMITS" ]; then
            problems="${problems}maiavm is ${behind_commits} commits behind NousResearch/hermes-agent:main (threshold: ${MAX_BEHIND_COMMITS}). "
          fi
          if [ -n "$open_pr_created" ] && [ "$pr_age_h" -gt "$MAX_OPEN_PR_HOURS" ]; then
            problems="${problems}Open bot/upstream-sync PR has been waiting ${pr_age_h}h. "
          fi

          {
            echo "## maiavm sync watchdog"
            echo ""
            echo "- Upstream lag: **${behind_commits}** commits behind \`NousResearch/hermes-agent:main\`"
            echo "- Last sync run: ${last_any:-never} (${run_age_h}h ago, conclusion: ${last_conclusion:-none})"
            echo "- Last successful sync: ${last_success:-never} (${success_age_h}h ago)"
            echo "- Open sync PR age: ${open_pr_created:-none} (${pr_age_h}h)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$problems" ]; then
            echo "Sync is healthy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "**ALERT:** $problems" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          send_alert() {
            local text="$1"
            if [ -n "${MAIAVM_SYNC_ALERT_TELEGRAM_TOKEN:-}" ] && [ -n "${MAIAVM_SYNC_ALERT_TELEGRAM_CHAT_ID:-}" ]; then
              curl -fsS -m 15 -X POST \
                "https://api.telegram.org/bot${MAIAVM_SYNC_ALERT_TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${MAIAVM_SYNC_ALERT_TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${text}" \
                --data-urlencode "disable_web_page_preview=true" >/dev/null \
                || echo "::warning::telegram alert failed"
            elif [ -n "${MAIAVM_SYNC_ALERT_WEBHOOK:-}" ]; then
              local payload
              payload="$(jq -n --arg t "$text" '{text:$t, content:$t}')"
              curl -fsS -m 15 -X POST -H 'Content-Type: application/json' -d "$payload" \
                "$MAIAVM_SYNC_ALERT_WEBHOOK" || echo "::warning::alert webhook failed"
            else
              echo "::warning::No alert channel configured; only this run's summary reports it."
            fi
          }
          send_alert "maiavm sync watchdog: ${problems}"
          exit 1
