name: maiavm release tag

# Fork-only (see FORK.md): tag the current `maiavm` head as maiavm-YYYY.MM.DD
# for hermes-deploy to pin. Names never match the upstream `v*.*.*` release
# triggers, so no inherited publish/installer workflow fires. The annotated
# tag message records the upstream commit this head integrated, and an optional
# repository_dispatch notifies Maia-VM/hermes-deploy.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'One line describing this release (stored in the tag message)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'DevvGwardo/hermes-agent' && github.ref == 'refs/heads/maiavm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional PAT with `repo` scope on Maia-VM/hermes-deploy. Job-level so the
      # step-level `if: env.DISPATCH_TOKEN != ''` guard can see it.
      DISPATCH_TOKEN: ${{ secrets.HERMES_DEPLOY_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maiavm
          fetch-depth: 0

      - name: Resolve integrated upstream SHA
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `upstream` mirrors NousResearch/hermes-agent:main and the merged sync
          # PR body records the exact SHA it integrated. Prefer the PR body, then
          # the mirror head, then the newest mirror commit inside this maiavm head.
          git fetch --no-tags origin refs/heads/upstream:refs/remotes/origin/upstream || true
          mirror_sha="$(git rev-parse --verify origin/upstream 2>/dev/null || true)"
          pr_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=maiavm&per_page=30" \
            --jq 'map(select(.merged == true)) | .[].body // ""' 2>/dev/null \
            | grep -oE 'Upstream commit: `[0-9a-f]{7,40}`' | head -1 \
            | grep -oE '[0-9a-f]{7,40}' || true)"
          sha=""
          for candidate in "$pr_sha" "$mirror_sha"; do
            [ -n "$candidate" ] || continue
            if git merge-base --is-ancestor "$candidate" HEAD 2>/dev/null; then
              sha="$(git rev-parse "$candidate")"
              break
            fi
          done
          if [ -z "$sha" ] && [ -n "$mirror_sha" ]; then
            sha="$(git merge-base HEAD "$mirror_sha" 2>/dev/null || true)"
          fi
          echo "Integrated upstream SHA: ${sha:-unknown}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        env:
          NOTE: ${{ inputs.note }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="maiavm-$(date -u +%Y.%m.%d)"
          tag="$base"; n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="$base-$n"; n=$((n + 1)); done

          msg_args=(-m "${NOTE:-maiavm release} ($(git rev-parse --short HEAD))")
          if [ -n "${UPSTREAM_SHA:-}" ]; then
            msg_args+=(-m "Integrated upstream: $UPSTREAM_SHA")
          fi
          git tag -a "$tag" "${msg_args[@]}"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "Tagged $tag at $(git rev-parse HEAD)"
            echo "Integrated upstream: ${UPSTREAM_SHA:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch fork-release to hermes-deploy
        if: env.DISPATCH_TOKEN != ''
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg tag "$TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{event_type:"fork-release",client_payload:{tag:$tag,repository:$repo}}')"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Maia-VM/hermes-deploy/dispatches" \
            -d "$payload"
          echo "Dispatched fork-release (tag $TAG) to Maia-VM/hermes-deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Skip hermes-deploy dispatch
        if: env.DISPATCH_TOKEN == ''
        shell: bash
        run: |
          echo "HERMES_DEPLOY_DISPATCH_TOKEN is not set; skipping hermes-deploy dispatch." >> "$GITHUB_STEP_SUMMARY"
